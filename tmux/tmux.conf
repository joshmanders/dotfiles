# Prefix: Ctrl-;
unbind C-b
unbind C-\;
set -g prefix C-\;
bind \; send-prefix

# Terminal & colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g set-titles on
set -g set-titles-string "#{?@title,#{@title},#{session_name}}"

# Extended keys (CSI-u) — required for C-; prefix and modifier combos like
# Shift+Enter, Ctrl+Shift+<key> to reach apps (Claude Code, Neovim, etc.)
set -s extended-keys always
set -s extended-keys-format csi-u
set -s terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title:extkeys'
set -as terminal-features 'screen*:title'

# Sensible defaults
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g status-interval 5
set -g display-time 4000
setw -g aggressive-resize on

# Pane borders
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#555555"
set -g window-active-style "bg=default"
set -g window-style "bg=#0a0a0a"

# Copy/scroll mode styling
set -g mode-style "bg=#333333,fg=#ffffff"
set -g copy-mode-match-style "bg=#007700,fg=#ffffff"
set -g copy-mode-current-match-style "bg=#e60000,fg=#ffffff"

set -g status-position top

# Status bar — match oh-my-posh theme
set -g status-style "bg=#2d2d2d,fg=#ffffff"
set -g status-left "#[bg=#2d2d2d,fg=#ffffff,bold] #{?@title,#{@title},#{session_name}} #[fg=#2d2d2d,bg=default]"
set -g status-left-length 30
set -g status-right ""
set -g window-status-format "#[fg=default,bg=default] #I:#W "
set -g window-status-current-format "#[fg=#2d2d2d,bg=#007700]#[fg=#ffffff,bg=#007700,bold] #I:#W #[fg=#007700,bg=default]"
set -g window-status-separator ""

# Auto-hide status bar when only one window
set -g status off
set-hook -g after-new-window      'if -F "#{==:#{session_windows},1}" "set status off" "set status on"'
set-hook -g after-kill-pane       'if -F "#{==:#{session_windows},1}" "set status off" "set status on"'
set-hook -g pane-exited           'if -F "#{==:#{session_windows},1}" "set status off" "set status on"'
set-hook -g window-unlinked       'if -F "#{==:#{session_windows},1}" "set status off" "set status on"'
set-hook -g session-window-changed 'if -F "#{==:#{session_windows},1}" "set status off" "set status on"'

# Auto-save mux pane layouts
set-hook -g after-split-window 'run-shell -b "sleep 3 && mux --save >/dev/null 2>&1 || true"'
set-hook -g pane-exited 'run-shell -b "mux --save >/dev/null 2>&1 || true"'
set-hook -g client-detached 'run-shell -b "mux --save >/dev/null 2>&1 || true"'

# Vi copy mode
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind -T copy-mode-vi q send -X cancel
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
# Disable search (/ in copy-mode-vi defaults to search — unbind it)
bind -T copy-mode-vi / send -X cancel

# --- Prefix-based keybindings (C-; then key) ---

# Splits (in current path)
unbind '"'
unbind %
bind \\ split-window -h -c "#{pane_current_path}"
bind Enter split-window -v -c "#{pane_current_path}"

# Pane resize (repeatable without re-pressing prefix)
bind -r - resize-pane -D 2
bind -r = resize-pane -U 2
bind -r [ resize-pane -L 2
bind -r ] resize-pane -R 2

# Equalize panes (tiled layout)
bind -r DC select-layout tiled

# Close pane
bind x kill-pane

# Zoom (toggle fullscreen on a pane)
bind z resize-pane -Z
# Disable tmux's default `prefix C-z suspend-client` — easy to hit by accident
# with a Ctrl-based prefix. Does nothing rather than suspending the client.
unbind C-z

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Session switcher
bind s choose-tree -s

# Clear screen and scrollback
bind C-k send-keys C-l \; clear-history

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Messages and prompts
set -g message-style "bg=#2d2d2d,fg=#ffffff"
set -g message-command-style "bg=#2d2d2d,fg=#ffffff"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Better mouse mode: exit copy mode when scrolling to bottom
set -g @scroll-down-exit-copy-mode 'on'
set -g @scroll-in-moused-over-pane 'on'
set -g @emulate-scroll-for-no-mouse-alternate-buffer 'on'

# Continuum: auto-save every 15 min, auto-restore on start
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

# Initialize TPM and auto-install plugins (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
run -b '~/.tmux/plugins/tpm/bin/install_plugins > /dev/null 2>&1'
