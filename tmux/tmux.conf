# Prefix: Ctrl-a (still needed for some commands)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Terminal & colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g set-titles on
set -g set-titles-string "#{?@title,#{@title},#{session_name}}"

# Sensible defaults
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on
set -g status-interval 5
# Pane borders
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#555555"
set -g window-active-style "bg=default"
set -g window-style "bg=#0a0a0a"

# Copy/scroll mode styling
set -g mode-style "bg=#333333,fg=#ffffff"
set -g copy-mode-match-style "bg=#007700,fg=#ffffff"
set -g copy-mode-current-match-style "bg=#e60000,fg=#ffffff"

set -g status-position top

# Status bar — match oh-my-posh theme
set -g status-style "bg=#2d2d2d,fg=#ffffff"
set -g status-left "#[bg=#2d2d2d,fg=#ffffff,bold] #{?@title,#{@title},#{session_name}} #[fg=#2d2d2d,bg=default]\ue0b0"
set -g status-left-length 30
set -g status-right ""
set -g window-status-format "#[fg=default,bg=default] #I:#W "
set -g window-status-current-format "#[fg=#2d2d2d,bg=#007700]\ue0b0#[fg=#ffffff,bg=#007700,bold] #I:#W #[fg=#007700,bg=default]\ue0b0"
set -g window-status-separator ""

# Auto-hide status bar when only one window
set -g status off
set-hook -g after-new-window      'if -F "#{==:#{session_windows},1}" "set status off" "set status on"'
set-hook -g after-kill-pane       'if -F "#{==:#{session_windows},1}" "set status off" "set status on"'
set-hook -g pane-exited           'if -F "#{==:#{session_windows},1}" "set status off" "set status on"'
set-hook -g window-unlinked       'if -F "#{==:#{session_windows},1}" "set status off" "set status on"'
set-hook -g session-window-changed 'if -F "#{==:#{session_windows},1}" "set status off" "set status on"'

# Auto-save mux pane layouts
set-hook -g after-split-window 'run-shell -b "sleep 3 && mux --save >/dev/null 2>&1 || true"'
set-hook -g after-select-pane 'run-shell -b "sleep 3 && mux --save >/dev/null 2>&1 || true"'
set-hook -g pane-exited 'run-shell -b "mux --save >/dev/null 2>&1 || true"'
set-hook -g client-detached 'run-shell -b "mux --save >/dev/null 2>&1 || true"'

# Vi copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
# Disable search (/ in copy-mode-vi defaults to search — unbind it)
bind -T copy-mode-vi / send -X cancel
unbind -T root M-f

# --- Option key bindings (no prefix needed) ---

# Splits (in current path)
bind -n M-| split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"

# Pane navigation
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Pane resize
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# Clear screen and scrollback
bind -n M-k send-keys C-l \; clear-history

# Close pane
bind -n M-w kill-pane

# Windows (tabs)
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-n next-window
bind -n M-p previous-window

# Session switcher
bind -n M-s choose-tree -s

# Detach
bind -n M-d detach-client

# Zoom (toggle fullscreen on a pane)
bind -n M-z resize-pane -Z

# Messages and prompts
set -g message-style "bg=#2d2d2d,fg=#ffffff"
set -g message-command-style "bg=#2d2d2d,fg=#ffffff"

# Reload config
bind -n M-r source-file ~/.tmux.conf \; display "Config reloaded"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# Better mouse mode: exit copy mode when scrolling to bottom
set -g @scroll-down-exit-copy-mode 'on'
set -g @scroll-in-moused-over-pane 'on'
set -g @emulate-scroll-for-no-mouse-alternate-buffer 'on'

# Resurrect: save/restore pane contents
set -g @resurrect-capture-pane-contents 'on'

# Continuum: auto-save every 15 min, auto-restore on start
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

# Initialize TPM and auto-install plugins (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
run -b '~/.tmux/plugins/tpm/bin/install_plugins > /dev/null 2>&1'
