name: Guard Hook Tests

on:
  push:
    paths:
      - "claude/hooks/**"
      - ".github/workflows/guard-hook.yml"
  pull_request:
    paths:
      - "claude/hooks/**"
      - ".github/workflows/guard-hook.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash claude/hooks/guard.test.sh
